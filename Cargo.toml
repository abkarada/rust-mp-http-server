[package]
name = "high-performance-http-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.68"
bytes = "1.3.0"
thiserror = "1.0.38"
flate2 = "1.1.9"
base64 = "0.22"
mio = { version = "1.2.2", features = ["os-poll", "net"] }
httparse = "1.8"
hpack = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
rustls-pki-types = "1.7"
